<script>
  const ICON_MAP = {
    'Home': '🏠', 'Strength': '🏋️', 'Swimming': '🏊', 'Cardio': '🏃',
    'Yoga': '🧘', 'Walking': '🚶', 'Aerobics': '🤸', 'Boxing': '🥊',
    'Cycling': '🚴', 'Pilates': '🧘', 'Climbing': '🧗'
  };

  const QUOTES = [
    '"Consistency is what transforms average into excellence."',
    '"Small daily improvements over time lead to stunning results."',
    '"Take care of your body. It is the only place you have to live in."',
    '"Fitness is a mind game. Your body can stand almost anything."'
  ];

  let currentViewDate = new Date();
  let selectedDateKey = getFormattedDateKey(new Date());
  let logs = JSON.parse(localStorage.getItem('workout_logs_data') || '{}');

  function getFormattedDateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function init() {
    document.getElementById('quoteBar').innerText = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    renderCalendar();
    updateKPIs();
    updateSelectedDateLabel();
  }

  function renderCalendar() {
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    const year = currentViewDate.getFullYear();
    const month = currentViewDate.getMonth();

    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    document.getElementById('calMonthTitle').innerText = `${monthNames[month]} ${year}`;

    const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    weekdays.forEach(w => {
      const h = document.createElement('div');
      h.className = 'weekday-hdr';
      h.innerText = w;
      grid.appendChild(h);
    });

    const firstDayIndex = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDayIndex; i++) {
      grid.appendChild(document.createElement('div'));
    }

    for (let d = 1; d <= totalDays; d++) {
      const cellDateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const cell = document.createElement('div');
      cell.className = `day-cell ${cellDateKey === selectedDateKey ? 'selected' : ''}`;
      
      const num = document.createElement('div');
      num.className = 'day-num';
      num.innerText = d;
      cell.appendChild(num);

      // FIX #3: Safely support both legacy objects and arrays for rendering
      const rawEntry = logs[cellDateKey];
      if (rawEntry) {
        const dayLogs = Array.isArray(rawEntry) ? rawEntry : [rawEntry];
        if (dayLogs.length > 0) {
          const status = document.createElement('div');
          status.className = 'day-status';
          const primaryIcon = getIconForActivity(dayLogs[0].type);

          if (dayLogs.length === 1) {
            status.innerHTML = `✅<br>${primaryIcon}`;
          } else {
            status.innerHTML = `✅<br>${primaryIcon}<div style="font-size: 0.6rem; background: #334155; padding: 1px 4px; border-radius: 4px; color: #a7f3d0; margin-top: 2px;">+${dayLogs.length - 1}</div>`;
          }
          cell.appendChild(status);
        }
      }

      cell.onclick = () => {
        selectedDateKey = cellDateKey;
        renderCalendar();
        updateSelectedDateLabel();
      };

      grid.appendChild(cell);
    }
  }

  // FIX #1: Guard against null/undefined types
  function getIconForActivity(type) {
    if (!type) return '🎯';
    if (ICON_MAP[type]) return ICON_MAP[type];
    for (let key in ICON_MAP) {
      if (type.toLowerCase().includes(key.toLowerCase())) return ICON_MAP[key];
    }
    return '🎯';
  }

  function toggleCustomInput() {
    const sel = document.getElementById('workoutSelect').value;
    document.getElementById('customInput').style.display = (sel === 'CUSTOM') ? 'block' : 'none';
  }

  function updateSelectedDateLabel() {
    const entry = logs[selectedDateKey];
    let count = 0;
    if (entry) {
      count = Array.isArray(entry) ? entry.length : 1;
    }
    document.getElementById('selectedDateLabel').innerText = `Selected Date: ${selectedDateKey} (${count} workout${count !== 1 ? 's' : ''})`;
  }

  function logWorkout() {
    const isDone = document.getElementById('chkDone').checked;
    if (!isDone) return;

    let typeSel = document.getElementById('workoutSelect').value;
    if (typeSel === 'CUSTOM') {
      typeSel = document.getElementById('customInput').value.trim() || 'Custom Activity';
    }

    if (logs[selectedDateKey] && !Array.isArray(logs[selectedDateKey])) {
      logs[selectedDateKey] = [logs[selectedDateKey]];
    } else if (!logs[selectedDateKey]) {
      logs[selectedDateKey] = [];
    }

    logs[selectedDateKey].push({ type: typeSel, completed: true, timestamp: new Date().getTime() });
    localStorage.setItem('workout_logs_data', JSON.stringify(logs));
    
    renderCalendar();
    updateKPIs();
    updateSelectedDateLabel();
  }

  function deleteWorkout() {
    if (logs[selectedDateKey]) {
      if (!Array.isArray(logs[selectedDateKey])) {
        logs[selectedDateKey] = [logs[selectedDateKey]];
      }

      logs[selectedDateKey].pop();

      if (logs[selectedDateKey].length === 0) {
        delete logs[selectedDateKey];
      }

      localStorage.setItem('workout_logs_data', JSON.stringify(logs));
      renderCalendar();
      updateKPIs();
      updateSelectedDateLabel();
    }
  }

  function changeMonth(delta) {
    currentViewDate.setMonth(currentViewDate.getMonth() + delta);
    renderCalendar();
  }

  function updateKPIs() {
    const activeKeys = Object.keys(logs).filter(k => {
      const val = logs[k];
      if (Array.isArray(val)) return val.length > 0;
      return val && val.completed;
    }).sort();

    document.getElementById('totalDays').innerText = activeKeys.length;

    const viewYear = currentViewDate.getFullYear();
    const viewMonth = String(currentViewDate.getMonth() + 1).padStart(2, '0');
    const monthPrefix = `${viewYear}-${viewMonth}`;
    
    const currentMonthDays = activeKeys.filter(k => k.startsWith(monthPrefix)).length;
    document.getElementById('currentStreak').innerText = currentMonthDays;

    let maxStreak = 0;
    let tempStreak = 0;

    // FIX #2: Safe local date parsing for streak calculation
    const parseKeyToLocalDate = key => {
      const parts = key.split('-').map(Number);
      return new Date(parts[0], parts[1] - 1, parts[2]);
    };

    for (let i = 0; i < activeKeys.length; i++) {
      if (i === 0) {
        tempStreak = 1;
      } else {
        const prev = parseKeyToLocalDate(activeKeys[i - 1]);
        const curr = parseKeyToLocalDate(activeKeys[i]);
        const diffDays = Math.round((curr - prev) / (1000 * 60 * 60 * 24));
        
        if (diffDays === 1) {
          tempStreak++;
        } else {
          tempStreak = 1;
        }
      }
      if (tempStreak > maxStreak) maxStreak = tempStreak;
    }

    document.getElementById('bestStreak').innerText = maxStreak;
  }

  init();
</script>

<!DOCTYPE html>
<!-- Custom App Icon for Phone Home Screen -->
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>30-Min Workout Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { max-width: 600px; width: 100%; display: flex; flex-direction: column; gap: 16px; }

    /* Top Quote */
    .quote-bar { background: var(--card-bg); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; text-align: center; font-size: 0.85rem; color: #a7f3d0; font-style: italic; }

    /* KPIs */
    .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .kpi-card { background: var(--card-bg); border: 1px solid var(--border); padding: 12px; border-radius: 8px; text-align: center; }
    .kpi-val { font-size: 1.4rem; font-weight: bold; color: var(--accent); }
    .kpi-lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; }

    /* Calendar */
    .calendar-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .cal-title { font-weight: bold; font-size: 1.1rem; }
    .cal-nav { background: var(--border); color: var(--text); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .weekday-hdr { text-align: center; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; padding-bottom: 4px; }
    
    .day-cell {
      aspect-ratio: 1; border-radius: 8px; background: #0f172a; border: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 4px; cursor: pointer; position: relative; transition: all 0.15s ease;
    }
    .day-cell:hover { border-color: var(--text-muted); }
    .day-cell.selected { border: 2px solid #38bdf8 !important; background: #1e293b; }
    .day-num { font-size: 0.75rem; align-self: flex-start; color: var(--text-muted); }
    .day-status { font-size: 0.9rem; margin-top: auto; margin-bottom: auto; text-align: center; line-height: 1; }

    /* Controls */
    .control-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .date-label { font-size: 0.9rem; color: #38bdf8; font-weight: 600; text-align: center; }
    .form-group { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
    .form-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
    
    select, input[type="text"] {
      width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; font-size: 0.9rem; outline: none;
    }
    select:focus, input[type="text"]:focus { border-color: #38bdf8; }

    .btn-row { display: flex; gap: 10px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    .btn-primary { background: var(--accent); color: #022c22; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Quote -->
  <div class="quote-bar" id="quoteBar">"Consistency is what transforms average into excellence."</div>

  <!-- KPIs -->
  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-val" id="totalDays">0</div><div class="kpi-lbl">Total Days</div></div>
    <div class="kpi-card"><div class="kpi-val" id="currStreak">0</div><div class="kpi-lbl">Current Streak</div></div>
    <div class="kpi-card"><div class="kpi-val" id="bestStreak">0</div><div class="kpi-lbl">Best Streak</div></div>
  </div>

  <!-- Calendar -->
  <div class="calendar-card">
    <div class="cal-header">
      <button class="cal-nav" onclick="changeMonth(-1)">&#9664;</button>
      <div class="cal-title" id="calMonthTitle">July 2026</div>
      <button class="cal-nav" onclick="changeMonth(1)">&#9654;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <!-- Control Box -->
  <div class="control-card">
    <div class="date-label" id="selectedDateLabel">Selected Date: --</div>
    <div class="form-group">
      <input type="checkbox" id="chkDone" checked />
      <label for="chkDone">30 Minutes Completed</label>
    </div>
    
    <select id="workoutSelect" onchange="toggleCustomInput()">
      <option value="Home">🏠 Home Workout</option>
      <option value="Strength">🏋️ Strength Training</option>
      <option value="Swimming">🏊 Swimming</option>
      <option value="Cardio">🏃 Cardio / Running</option>
      <option value="Yoga">🧘 Yoga / Stretching</option>
      <option value="Walking">🚶 Walking</option>
      <option value="Aerobics">🤸 Aerobics</option>
      <option value="CUSTOM">+ Add Custom Workout...</option>
    </select>

    <input type="text" id="customInput" placeholder="Type custom workout (e.g. Kickboxing, Pilates)" style="display: none;" />

    <div class="btn-row">
      <button class="btn btn-primary" onclick="logWorkout()">Log Workout</button>
      <button class="btn btn-danger" onclick="deleteWorkout()">Delete</button>
    </div>
  </div>
</div>

<script>
  const ICON_MAP = {
    'Home': '🏠', 'Strength': '🏋️', 'Swimming': '🏊', 'Cardio': '🏃',
    'Yoga': '🧘', 'Walking': '🚶', 'Aerobics': '🤸', 'Boxing': '🥊',
    'Cycling': '🚴', 'Pilates': '🧘', 'Climbing': '🧗'
  };

  const QUOTES = [
    '"Consistency is what transforms average into excellence."',
    '"Small daily improvements over time lead to stunning results."',
    '"Take care of your body. It is the only place you have to live in."',
    '"Fitness is a mind game. Your body can stand almost anything."'
  ];

  let currentViewDate = new Date();
  let selectedDateKey = getFormattedDateKey(new Date());
  let logs = JSON.parse(localStorage.getItem('workout_logs_data') || '{}');

  function getFormattedDateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function init() {
    document.getElementById('quoteBar').innerText = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    renderCalendar();
    updateKPIs();
    updateSelectedDateLabel();
  }

  function renderCalendar() {
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    const year = currentViewDate.getFullYear();
    const month = currentViewDate.getMonth();

    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    document.getElementById('calMonthTitle').innerText = `${monthNames[month]} ${year}`;

    const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    weekdays.forEach(w => {
      const h = document.createElement('div');
      h.className = 'weekday-hdr';
      h.innerText = w;
      grid.appendChild(h);
    });

    const firstDayIndex = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDayIndex; i++) {
      grid.appendChild(document.createElement('div'));
    }

    for (let d = 1; d <= totalDays; d++) {
      const cellDateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const cell = document.createElement('div');
      cell.className = `day-cell ${cellDateKey === selectedDateKey ? 'selected' : ''}`;
      
      const num = document.createElement('div');
      num.className = 'day-num';
      num.innerText = d;
      cell.appendChild(num);

      if (logs[cellDateKey]) {
        const status = document.createElement('div');
        status.className = 'day-status';
        const icon = getIconForActivity(logs[cellDateKey].type);
        status.innerHTML = `✅<br>${icon}`;
        cell.appendChild(status);
      }

      cell.onclick = () => {
        selectedDateKey = cellDateKey;
        renderCalendar();
        updateSelectedDateLabel();
      };

      grid.appendChild(cell);
    }
  }

  function getIconForActivity(type) {
    if (ICON_MAP[type]) return ICON_MAP[type];
    for (let key in ICON_MAP) {
      if (type.toLowerCase().includes(key.toLowerCase())) return ICON_MAP[key];
    }
    return '🎯';
  }

  function toggleCustomInput() {
    const sel = document.getElementById('workoutSelect').value;
    document.getElementById('customInput').style.display = (sel === 'CUSTOM') ? 'block' : 'none';
  }

  function updateSelectedDateLabel() {
    document.getElementById('selectedDateLabel').innerText = `Selected Date: ${selectedDateKey}`;
  }

  function logWorkout() {
    const isDone = document.getElementById('chkDone').checked;
    if (!isDone) return;

    let typeSel = document.getElementById('workoutSelect').value;
    if (typeSel === 'CUSTOM') {
      typeSel = document.getElementById('customInput').value.trim() || 'Custom Activity';
    }

    logs[selectedDateKey] = { type: typeSel, completed: true };
    localStorage.setItem('workout_logs_data', JSON.stringify(logs));
    
    renderCalendar();
    updateKPIs();
  }

  function deleteWorkout() {
    if (logs[selectedDateKey]) {
      delete logs[selectedDateKey];
      localStorage.setItem('workout_logs_data', JSON.stringify(logs));
      renderCalendar();
      updateKPIs();
    }
  }

  function changeMonth(delta) {
    currentViewDate.setMonth(currentViewDate.getMonth() + delta);
    renderCalendar();
  }

  function updateKPIs() {
    const keys = Object.keys(logs).sort();
    document.getElementById('totalDays').innerText = keys.length;

    let currentStreak = 0;
    let maxStreak = 0;
    let tempStreak = 0;

    // Calculate streaks based on logged dates
    if (keys.length > 0) {
      const todayKey = getFormattedDateKey(new Date());
      let checkDate = new Date();
      
      // Check current streak backwards from today
      while (true) {
        const k = getFormattedDateKey(checkDate);
        if (logs[k]) {
          currentStreak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else if (k === todayKey) {
          // If today isn't logged yet, check yesterday
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          break;
        }
      }

      // Max streak calculation
      for (let i = 0; i < keys.length; i++) {
        if (i === 0) {
          tempStreak = 1;
        } else {
          const prev = new Date(keys[i - 1]);
          const curr = new Date(keys[i]);
          const diffDays = Math.round((curr - prev) / (1000 * 60 * 60 * 24));
          if (diffDays === 1) {
            tempStreak++;
          } else {
            tempStreak = 1;
          }
        }
        if (tempStreak > maxStreak) maxStreak = tempStreak;
      }
    }

    document.getElementById('currStreak').innerText = currentStreak;
    document.getElementById('bestStreak').innerText = Math.max(currentStreak, maxStreak);
  }

  init();
</script>
</body>
</html>
